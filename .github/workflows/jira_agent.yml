name: Autonomous Jira Software Engineer Agent

on:
  repository_dispatch:
    types: [jira_ticket_created, jira_issue_created]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Jira Ticket Key (e.g. KAN-3)'
        required: true
        default: 'KAN-3'

jobs:
  run-agent:
    name: Run Jira Multi-Agent Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Ticket Key
        id: ticket
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TICKET_ID="${{ github.event.inputs.ticket_id }}"
          else
            TICKET_ID="${{ github.event.client_payload.ticket_id }}"
          fi
          echo "TICKET_ID=${TICKET_ID}" >> $GITHUB_ENV
          echo "Selected Jira ticket: ${TICKET_ID}"

      - name: Run Multi-Agent Execution Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: llama-3.3-70b-versatile
          CORE_REPOSITORY_NAME: ${{ github.repository }}
          CORE_REPOSITORY_PATH: '.'
          NOTIFICATION_CHANNEL: email
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python -m agents.main --jira-ticket "${TICKET_ID}"

      - name: Log Execution Summary
        run: |
          echo "Jira agent workflow execution finished for ticket: ${TICKET_ID}"
